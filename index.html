<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakura — Petal Rain</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;1,300&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; width:100vw; height:100vh; font-family:'Crimson Pro',serif; cursor:none; background:#F6F4EE; }
  #stage { position:absolute; inset:40px; overflow:hidden; border-radius:24px; }
  #bgCanvas    { position:absolute; inset:0; z-index:1; }
  #petalCanvas { position:absolute; inset:0; z-index:3; pointer-events:none; }
  #handCanvas  { position:absolute; inset:0; z-index:5; pointer-events:none; }
  #cursorCanvas{ position:absolute; inset:0; z-index:20; pointer-events:none; }
  #webcam { position:absolute; visibility:hidden; width:640px; height:480px; top:0; left:0; }

  /* ── Guide panel ── */
  #guide { position:absolute; top:72px; left:70px; z-index:15; pointer-events:all; }
#checklist { list-style:none; font-size:14px; font-weight:300; color:#5a3a48; letter-spacing:0.04em; line-height:1.9; }
  #checklist li { display:flex; align-items:center; gap:7px; opacity:0.55; transition:opacity 0.5s; }
  #checklist li.done { opacity:0.85; }
  .chk { width:9px; height:9px; border:1px solid rgba(90,58,72,0.45); display:inline-block; flex-shrink:0; transition:background 0.4s; }
  .chk.done { background:rgba(90,58,72,0.55); border-color:rgba(90,58,72,0.7); }
  #camBtn {
    margin-top:15px; display:flex; align-items:center; gap:7px; cursor:pointer;
    font-family:'Crimson Pro',serif; font-size:14px; font-weight:300; letter-spacing:0.09em;
    color:#5a3a48; border:1px solid rgba(90,58,72,0.25); background:rgba(255,255,255,0.28);
    padding:6px 14px; transition:all 0.3s; backdrop-filter:blur(4px); pointer-events:all;
  }
  #camBtn:hover { background:rgba(255,255,255,0.50); border-color:rgba(90,58,72,0.45); opacity:1; }
  #camDot { width:6px; height:6px; border-radius:50%; background:rgba(180,140,155,0.5); transition:background 0.4s; }
  #camDot.on { background:#c9748a; }

  .fade-in { animation:fadeIn 1.8s ease forwards; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

  #loading {
    position:absolute; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(246,244,238,0.25);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    transition:opacity 1.1s ease, backdrop-filter 1.1s ease, -webkit-backdrop-filter 1.1s ease;
    cursor:default;
  }
  #loading.hide { opacity:0; pointer-events:none; backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px); }
  #loadTitle { font-size:32px; font-weight:300; color:#3d2b35; opacity:0.65; letter-spacing:0.25em; margin-bottom:10px; }
  #loadSub   { font-size:13px; font-weight:300; color:#3d2b35; opacity:0.35; letter-spacing:0.12em; margin-bottom:48px; }
  #loadBtn {
    font-family:'Crimson Pro',serif; font-size:14px; font-weight:300; letter-spacing:0.18em;
    color:#3d2b35; border:1px solid rgba(61,43,53,0.22); background:rgba(255,255,255,0.4);
    padding:13px 36px; cursor:pointer; transition:all 0.3s; backdrop-filter:blur(4px);
  }
  #loadBtn:hover:not(:disabled) { background:rgba(255,255,255,0.65); border-color:rgba(61,43,53,0.45); }
  #loadBtn:disabled { opacity:0.5; cursor:default; }
  #errMsg { margin-top:18px; max-width:360px; font-size:11.5px; font-weight:300; color:#a05060; opacity:0.85; letter-spacing:0.04em; text-align:center; line-height:1.7; display:none; }

  /* catch hint */
  #cuppingHint { display:none; }

  /* ── Circular camera preview ── */
  #camPreview {
    position:absolute; bottom:58px; left:58px; z-index:14;
    width:150px; height:150px; border-radius:50%; overflow:hidden;
    opacity:0; pointer-events:none;
    transition:opacity 0.6s ease;
    box-shadow:0 4px 24px rgba(0,0,0,0.12);
    border:2px solid rgba(255,255,255,0.55);
  }
  #camPreview.active { opacity:1; }
  #camPreviewVid {
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1);
  }

</style>
</head>
<body>

<div id="loading">
  <div id="loadTitle">Sakura</div>
  <div id="loadSub">an interactive petal experience</div>
  <button id="loadBtn">Allow Camera &amp; Begin</button>
  <div id="errMsg"></div>
</div>

<video id="webcam" autoplay playsinline muted></video>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <canvas id="petalCanvas"></canvas>
  <canvas id="handCanvas"></canvas>
  <canvas id="cursorCanvas"></canvas>
</div>

<div id="guide">
  <ul id="checklist">
    <li id="c-wave"><span class="chk"></span>wave to guide the wind</li>
    <li id="c-bloom"><span class="chk"></span>snap palm open to bloom</li>
    <li id="c-catch"><span class="chk"></span>hold palm up to catch petals</li>
  </ul>
  <button id="camBtn"><span id="camDot"></span><span id="camLabel">enable camera</span></button>
</div>
<div id="cuppingHint"></div>
<div id="camPreview"><video id="camPreviewVid" autoplay playsinline muted></video></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

}

//  matching the reference image (soft oval teardrops)
// ═══════════════════════════════════════════
const PETAL_PALETTES = [
  // [fill_r, fill_g, fill_b,  edge_r, edge_g, edge_b]  — watercolor: pale, muted, translucent
  [255, 218, 228,  230, 155, 175],   // soft pink
  [255, 228, 235,  238, 168, 188],   // pale blush
  [252, 210, 222,  225, 140, 162],   // light rose
  [255, 235, 240,  245, 185, 205],   // near white pink
  [248, 220, 230,  228, 158, 180],   // dusty rose
  [255, 242, 246,  240, 195, 212],   // whisper pink
];

class Petal {
  constructor(fromBloom=false, spawnX=null, spawnY=null){
    const W=pC.width, H=pC.height;
    if(spawnX!==null){
      this.x=spawnX; this.y=spawnY;
    } else {
      // Spawn across the full tree canopy (right portion of screen)
      // Tree spans roughly x: 52%–100%, y: 0–68% after background scale
      this.x = W*(0.52 + Math.random()*0.50);
      this.y = H*(Math.random()*0.68);
      // Bloom burst: cluster tighter around canopy center
      if(fromBloom){
        this.x = W*(0.68 + (Math.random()-0.5)*0.28);
        this.y = H*(0.15 + Math.random()*0.40);
      }
    }

    // Sprite scale: sprites are ~150px, scale to 20-38px equivalent
    this.spriteScale = (0.22 + Math.random()*0.14);
    this.rot = Math.random()*Math.PI*2;
    this.rotV= (Math.random()-0.5)*0.04;
    this.sprite = PETAL_SPRITES[Math.floor(Math.random()*PETAL_SPRITES.length)];

    // Physics — start with leftward drift matching wind direction
    this.vy  = 0.15 + Math.random()*0.25;  // light initial downward drift
    this.vx  = -(0.3 + Math.random()*0.4); // slower leftward drift
    this.wob = Math.random()*Math.PI*2;
    this.wobS= 0.02 + Math.random()*0.02;

    // Alpha: sprites have watercolor transparency built in
    this.alpha = 0.75 + Math.random()*0.25;
    this.age   = 0; // frames alive — used for fade-in

    // State
    this.onHand  = false;
    this.palmX   = 0; this.palmY = 0;  // which palm this petal is attached to
    this.offsetX = 0; this.offsetY= 0; // offset from palm center when attached
    this.spill   = false;
    this.sVx=0; this.sVy=0;

    if(fromBloom){
      this.vx = -(0.5+Math.random()*1.5);
      this.vy = -(0.2+Math.random()*0.5);
    }
  }

  draw(ctx){
    const spr = this.sprite;
    if(!spr || !spr.complete || !spr.naturalWidth) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    const fadeIn = Math.min(1, this.age / 45); // ~0.75s fade-in at 60fps
    ctx.globalAlpha = this.alpha * fadeIn;
    const sw = spr.naturalWidth  * this.spriteScale;
    const sh = spr.naturalHeight * this.spriteScale;
    ctx.drawImage(spr, -sw/2, -sh/2, sw, sh);
    ctx.restore();
  }

  update(windVx, windVy=0){
    if(this.onHand) return;
    if(this.spill){
      this.x  += this.sVx;
      this.y  += this.sVy;
      this.sVy += 0.055;
      this.sVx *= 0.97;
      this.alpha -= 0.008;
      this.rot += this.rotV*1.5;
      return;
    }
    // Gravity arc for tossed petals (stronger pull)
    if(this.hasGravity){
      this.vy += 0.048;
      if(this.vy > 0.6) this.hasGravity = false; // hand off to normal fall
    }
    // Universal gravity — petals always fall downward
    this.vy = Math.min(this.vy + 0.004, 1.2);
    this.wob += this.wobS;
    this.vx += (windVx - this.vx) * 0.035;
    this.x  += this.vx + Math.sin(this.wob)*0.6;
    this.y  += this.vy + windVy;
    this.rot += this.rotV + Math.abs(windVx)*0.005;
    this.age++;
  }

  isDead(){
    if(this.spill && this.alpha<=0) return true;
    return this.y > pC.height+20 || this.x < -160;
  }
}

const petals=[];
let petalCount=18;       // light default — use bloom gesture to add more
const MAX_PETALS=200;
const BASE_DRIFT=-1.05;  // wind blows right→left by default
let windVx=BASE_DRIFT;
let windTarget=BASE_DRIFT;
let windVy=0, windVyTarget=0;

function maintainPetals(){
  const active=petals.filter(p=>!p.isDead()&&!p.onHand).length;
  if(active<petalCount && Math.random()<0.16) petals.push(new Petal());
}
function bloomBurst(){
  const n=16+Math.floor(Math.random()*12);
  for(let i=0;i<n;i++) if(petals.length<MAX_PETALS) petals.push(new Petal(true));
}

//  HAND SILHOUETTE — ghost / holographic white
// ═══════════════════════════════════════════
let detectedHands=[];

// ── Landmark smoothing ──
// Buffers per hand slot; adaptive EMA with dead-zone to kill micro-jitter
const lmBuffer=[null,null];
const SMOOTH=0.20;   // base blend factor  (lower = smoother / more lag)
const DEAD  =0.006;  // normalised dead-zone (~6 px at 1080-wide canvas)

function smoothLandmarks(raw, slot){
  if(!lmBuffer[slot]){
    lmBuffer[slot]=raw.map(l=>({x:l.x,y:l.y,z:l.z||0}));
    return lmBuffer[slot];
  }
  const buf=lmBuffer[slot];
  for(let i=0;i<raw.length;i++){
    const dx=raw[i].x-buf[i].x, dy=raw[i].y-buf[i].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>DEAD){
      // Larger movement → faster catch-up; tiny movement → stays still
      const a=Math.min(SMOOTH+d*1.8, 0.70);
      buf[i].x+=dx*a; buf[i].y+=dy*a;
      buf[i].z+=(( raw[i].z||0)-buf[i].z)*a;
    }
  }
  return buf;
}

function mirroredLandmarks(lm){
  const W=hC.width, H=hC.height;
  return lm.map(l=>({x:(1-l.x)*W, y:l.y*H}));
}

function drawHandSilhouette(ctx, lm_raw){
  if(!lm_raw||lm_raw.length<21) return;
  const lm=mirroredLandmarks(lm_raw);
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';

  const conn=[
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],
    [0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],
    [5,9],[9,13],[13,17]
  ];

  // Pass 1 — wide outer ambient glow (translucent white body)
  conn.forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(lm[a].x,lm[a].y); ctx.lineTo(lm[b].x,lm[b].y);
    ctx.strokeStyle='rgba(255,255,255,0.055)'; ctx.lineWidth=38; ctx.stroke();
  });
  // Pass 2 — mid body fill
  conn.forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(lm[a].x,lm[a].y); ctx.lineTo(lm[b].x,lm[b].y);
    ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=22; ctx.stroke();
  });
  // Pass 3 — inner glow halo
  conn.forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(lm[a].x,lm[a].y); ctx.lineTo(lm[b].x,lm[b].y);
    ctx.strokeStyle='rgba(255,255,255,0.30)'; ctx.lineWidth=7; ctx.stroke();
  });
  // Pass 4 — crisp bright edge line
  conn.forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(lm[a].x,lm[a].y); ctx.lineTo(lm[b].x,lm[b].y);
    ctx.strokeStyle='rgba(255,255,255,0.82)'; ctx.lineWidth=1.4; ctx.stroke();
  });

  // Joint sparkle dots
  lm.forEach((p,i)=>{
    const r=i===0?11:5;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2.8);
    g.addColorStop(0,'rgba(255,255,255,0.55)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,r*2.8,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
  });

  ctx.restore();
}

let wristHistory=[];

function fingersOpen(lm){
  return [[8,6],[12,10],[16,14],[20,18]].every(([t,p])=>lm[t].y<lm[p].y);
}

function getPalmCenter(lm_raw){
  const W=hC.width, H=hC.height;
  return {
    x:((1-lm_raw[0].x)+(1-lm_raw[5].x)+(1-lm_raw[9].x)+(1-lm_raw[13].x)+(1-lm_raw[17].x))/5*W,
    y:(lm_raw[0].y+lm_raw[5].y+lm_raw[9].y+lm_raw[13].y+lm_raw[17].y)/5*H
  };
}

function processGestures(hands){
  // Smooth landmarks per hand slot to kill jitter
  hands.forEach((h,i)=>{ if(i<2) h.landmarks=smoothLandmarks(h.landmarks,i); });
  // Clear buffers for slots that no longer have a hand
  if(hands.length<2) lmBuffer[1]=null;
  if(hands.length<1) lmBuffer[0]=null;
  detectedHands=hands;
  const now=performance.now();

  // ── WIND (wave speed → wind speed) ──
  if(hands.length>=1){
    const lm=hands[0].landmarks;
    const wx=(1-lm[0].x);
    const wy=lm[0].y; // wrist Y (0=top, 1=bottom in raw space)
    wristHistory.push({x:wx, t:now});
    wristYHistory.push({y:wy, t:now});
    wristHistory=wristHistory.filter(e=>now-e.t<220);
    wristYHistory=wristYHistory.filter(e=>now-e.t<220);
    if(wristHistory.length>=3){
      const dt=(wristHistory[wristHistory.length-1].t-wristHistory[0].t)/1000;
      const dx= wristHistory[wristHistory.length-1].x-wristHistory[0].x;
      if(dt>0.02 && Math.abs(dx)>0.14){ windTarget=(dx/dt)*3.5; markDone("c-wave"); }
    }
    if(wristYHistory.length>=3){
      const dt=(wristYHistory[wristYHistory.length-1].t-wristYHistory[0].t)/1000;
      const dy= wristYHistory[wristYHistory.length-1].y-wristYHistory[0].y;
      // dy < 0 means moving up in raw space (y decreases upward)
      if(dt>0.02 && dy < -0.10){ windVyTarget=(dy/dt)*5.0; markDone("c-wave"); }
    }
  } else {
    wristHistory=[];
    wristYHistory=[];
    // windTarget drifts back naturally via decay above — no hard snap
  }
  // Wind always decays back toward the default right→left drift
  windTarget+=(BASE_DRIFT-windTarget)*0.018;
  windVx+=(windTarget-windVx)*0.09;
  windVx=Math.max(-3.5,Math.min(3.5,windVx));
  // Vertical wind decays back to 0 (no default vertical wind)
  windVyTarget+=(0-windVyTarget)*0.018;
  windVy+=(windVyTarget-windVy)*0.09;
  windVy=Math.max(-4,Math.min(0,windVy)); // only upward gusts, not downward

  // ── BLOOM vs CATCH — discriminated by how quickly palm opens ──
  // Bloom  = snap-open: hand was CLOSED within last 320 ms, then opens fast
  // Catch  = held-open: palm has been continuously open for ≥ 450 ms (deliberate hold)
  bloomCooldown=Math.max(0,bloomCooldown-1);
  const now2=performance.now();
  const palmUpCenters=[];

  hands.forEach((h,i)=>{
    const lm=h.landmarks;
    const open=fingersOpen(lm);
    if(!handStates[i]) handStates[i]={lastClosedTime:now2-1000, openSince:null, closedSince:null, validFist:false, inCatch:false};
    const st=handStates[i];

    if(!open){
      // Track how long we've been closed
      if(st.closedSince===null) st.closedSince=now2;
      // Only count as a real fist if held closed ≥ 200ms (filters noise flickers)
      if(now2 - st.closedSince >= 200){
        st.lastClosedTime=now2;
        st.validFist=true;
      }
      st.openSince=null;
      st.inCatch=false; // hand closed — reset catch session lock
    } else {
      st.closedSince=null;
      if(st.openSince===null) st.openSince=now2; // just opened

      const timeSinceClosed = now2 - st.lastClosedTime;
      const holdDuration    = now2 - st.openSince;

      // Once held open ≥ 2s, lock into catch session — no bloom until hand closes
      if(holdDuration >= 2000) st.inCatch=true;

      if(!st.inCatch && st.validFist && timeSinceClosed < 350 && holdDuration < 350 && bloomCooldown===0){
        // Real snap-open from sustained fist → BLOOM (burst only, no permanent count increase)
        bloomBurst(); markDone('c-bloom');
        bloomCooldown=90;
        st.validFist=false;
        st.inCatch=true; // lock out further blooms for this open session
      } else if(holdDuration >= 450){
        // Held open ≥ 450 ms → CATCH mode
        st.validFist=false;
        palmUpCenters.push(getPalmCenter(lm));
      }
    }
  });

  // Purge state for hands that disappeared
  Object.keys(handStates).forEach(k=>{
    if(+k >= hands.length) delete handStates[k];
  });

  anyPalmUp = palmUpCenters.length>0;

  // ── CATCH petals in palm-up hands (natural flow — no magnet) ──
  if(anyPalmUp){
    petals.forEach(p=>{
      if(p.spill) return;
      if(!p.onHand){
        // No artificial pull — petal drifts naturally.
        // Settle only when it naturally passes over the palm while falling/drifting.
        let nearest=null, nearDist=Infinity;
        palmUpCenters.forEach(c=>{
          const d=Math.hypot(p.x-c.x, p.y-c.y);
          if(d<nearDist){ nearDist=d; nearest=c; }
        });
        if(nearest && nearDist<55 && p.vy>=0 && p.y<=nearest.y+20){
          // Petal fell down onto palm (not attracted up) — settle naturally
          p.onHand=true; markDone('c-catch');
          p.offsetX=(Math.random()-0.5)*90;  // spread across full palm width
          p.offsetY=(Math.random()-0.5)*38;
          p.palmX=nearest.x; p.palmY=nearest.y;
          p.vx=0; p.vy=0;
        }
      } else {
        // Petal resting on palm — follow it, carry wind drift
        let nearest=null, nearDist=Infinity;
        palmUpCenters.forEach(c=>{
          const d=Math.hypot(p.palmX-c.x, p.palmY-c.y);
          if(d<nearDist){ nearDist=d; nearest=c; }
        });
        if(nearest){
          // Palm velocity this frame (how fast/which direction the hand moved)
          const pvx=nearest.x-p.palmX;
          const pvy=nearest.y-p.palmY;
          p.palmX=nearest.x; p.palmY=nearest.y;

          // Wind gently shifts petal across the palm surface
          p.offsetX+=windVx*0.09;
          p.offsetX=Math.max(-55,Math.min(55,p.offsetX));

          // Target: slightly ABOVE palm center so it looks like it rests on hand
          const tx=nearest.x+p.offsetX;
          const ty=nearest.y+p.offsetY-28;  // 28px above palm centre
          // Smooth follow + carry palm's own velocity (hand movement carries petals)
          p.x+=(tx-p.x)*0.18 + pvx*0.45;
          p.y+=(ty-p.y)*0.18 + pvy*0.45;
          p.rot+=p.rotV*0.20+windVx*0.002;

          // Fast hand movement releases petals — they arc then fall under gravity
          const palmSpeed=Math.hypot(pvx,pvy);
          if(palmSpeed>10){
            p.onHand=false; markDone('c-toss');
            p.hasGravity=true;
            p.vx=pvx*0.45+windVx+(Math.random()-0.5)*0.6;
            p.vy=pvy*0.35-0.8; // small upward kick, gravity brings it down
          }
        } else {
          // Palm lowered — release with wind
          p.onHand=false;
          p.vx=windVx*0.8+(Math.random()-0.5)*0.6;
          p.vy=0.3+Math.random()*0.5;
        }
      }
    });
    document.getElementById('cuppingHint').classList.add('show');
  } else {
    petals.filter(p=>p.onHand).forEach(p=>{
      p.onHand=false;
      p.vx=windVx*0.8+(Math.random()-0.5)*0.6;
      p.vy=0.3+Math.random()*0.5;
    });
    document.getElementById('cuppingHint').classList.remove('show');
  }
}

// ═══════════════════════════════════════════
//  CURSOR
// ═══════════════════════════════════════════
function drawCursor(){
  curX.clearRect(0,0,curC.width,curC.height);
  if(mouseX<0) return;
  const r=12;
  const glow=curX.createRadialGradient(mouseX,mouseY,0,mouseX,mouseY,r*2.5);
  glow.addColorStop(0,'rgba(255,255,255,0.18)');
  glow.addColorStop(1,'rgba(255,255,255,0)');
  curX.beginPath(); curX.arc(mouseX,mouseY,r*2.5,0,Math.PI*2);
  curX.fillStyle=glow; curX.fill();
  curX.beginPath(); curX.arc(mouseX,mouseY,r,0,Math.PI*2);
  curX.strokeStyle='rgba(255,255,255,0.80)'; curX.lineWidth=1.5; curX.stroke();
  curX.beginPath(); curX.arc(mouseX,mouseY,2,0,Math.PI*2);
  curX.fillStyle='rgba(255,255,255,0.92)'; curX.fill();
}

// ═══════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════
function animLoop(){
  requestAnimationFrame(animLoop);
  pX.clearRect(0,0,pC.width,pC.height);
  hX.clearRect(0,0,hC.width,hC.height);

  maintainPetals();

  // Update then draw petals (draw in reverse so newer are on top)
  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i];
    p.update(windVx, windVy);
    if(p.isDead()){ petals.splice(i,1); continue; }
    p.draw(pX);
  }

  // Draw hand silhouettes
  detectedHands.forEach(h=>drawHandSilhouette(hX, h.landmarks));

  drawCursor();
}

// ═══════════════════════════════════════════
//  CHECKLIST helpers
// ═══════════════════════════════════════════
function markDone(id){
  const li=document.getElementById(id);
  if(!li||li.classList.contains('done')) return;
  li.classList.add('done');
  li.querySelector('.chk').classList.add('done');
}

// ═══════════════════════════════════════════
//  CAMERA — optional, toggled from guide panel
// ═══════════════════════════════════════════
let cameraActive=false, cameraStream=null, handsMP=null, sendLoop=false;
const vid=document.getElementById('webcam');

async function startCamera(){
  const lbl=document.getElementById('camLabel'), dot=document.getElementById('camDot');
  lbl.textContent='starting…';
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:640},height:{ideal:480},facingMode:'user'}, audio:false
    });
  }catch(e){
    lbl.textContent='camera unavailable';
    setTimeout(()=>{ lbl.textContent='enable camera'; },2000);
    return;
  }
  vid.srcObject=cameraStream;
  await new Promise(res=>{vid.onloadedmetadata=res;});
  try{ await vid.play(); }catch(_){}

  if(!handsMP){
    handsMP=new Hands({ locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    handsMP.setOptions({ maxNumHands:2, modelComplexity:1,
      minDetectionConfidence:0.72, minTrackingConfidence:0.65 });
    handsMP.onResults(res=>{
      if(res.multiHandLandmarks?.length>0){
        dot.classList.add('on');
        processGestures(res.multiHandLandmarks.map((lm,i)=>({
          landmarks:lm, handedness:res.multiHandedness[i]
        })));
      } else {
        dot.classList.remove('on');
        processGestures([]);
      }
    });
  }

  cameraActive=true; sendLoop=true;
  dot.classList.add('on');
  lbl.textContent='disable camera';
  // Show circular preview
  const prevVid=document.getElementById('camPreviewVid');
  prevVid.srcObject=cameraStream;
  document.getElementById('camPreview').classList.add('active');
  (async function send(){
    if(!sendLoop) return;
    try{ if(vid.readyState>=2) await handsMP.send({image:vid}); }catch(_){}
    requestAnimationFrame(send);
  })();
}

function stopCamera(){
  sendLoop=false; cameraActive=false;
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  vid.srcObject=null;
  // Hide circular preview
  document.getElementById('camPreviewVid').srcObject=null;
  document.getElementById('camPreview').classList.remove('active');
  processGestures([]);
  hX.clearRect(0,0,hC.width,hC.height);
  document.getElementById('camDot').classList.remove('on');
  document.getElementById('camLabel').textContent='enable camera';
}

document.getElementById('camBtn').addEventListener('click',()=>{
  cameraActive ? stopCamera() : startCamera();
});

// ── Start experience (no camera required) ──
async function startExperience(){
  const btn=document.getElementById('loadBtn');
  const err=document.getElementById('errMsg');
  btn.textContent='Starting…'; btn.disabled=true;
  err.style.display='none';
  // Hide loading, start animation first so something shows immediately
  document.getElementById('loading').classList.add('hide');
  resize(); animLoop();
  // Then start camera
  await startCamera();
}

document.getElementById('loadBtn').addEventListener('click', startExperience);
window.addEventListener('load', ()=>{ resize(); });
</script>
